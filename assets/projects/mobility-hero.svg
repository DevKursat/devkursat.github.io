<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e05"/>
      <stop offset="50%" stop-color="#241406"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#361f0a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f1105" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#mobBg)"/>

  <!-- Radial Glow -->
  <circle cx="400" cy="225" r="180" fill="#d97706" opacity="0.12" filter="url(#glowM)"/>

  <!-- Telemetry Dashboard & Fleet Grid -->
  <g transform="translate(130, 95)">
    <!-- Main Telemetry Console -->
    <rect width="250" height="260" rx="16" fill="url(#cardGradM)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.4"/>
    <text x="24" y="32" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">FLEET TELEMETRY &amp; DISPATCH</text>
    <text x="24" y="47" fill="#f59e0b" font-family="monospace" font-size="8.5">Real-time GPS · Deposit Lock</text>

    <!-- Stylized Luxury Car Silhouette -->
    <path d="M 30 110 C 50 110, 65 92, 90 92 L 140 92 C 165 92, 175 110, 220 110 L 225 125 L 25 125 Z" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="65" cy="125" r="12" fill="#1e0c02" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="185" cy="125" r="12" fill="#1e0c02" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="65" cy="125" r="4" fill="#fbbf24"/>
    <circle cx="185" cy="125" r="4" fill="#fbbf24"/>

    <!-- Telemetry Stats Strip -->
    <rect x="24" y="150" width="202" height="42" rx="8" fill="#1c0f05" stroke="#78350f" stroke-width="1"/>
    <text x="36" y="168" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">Mercedes-Benz S-Class 2026</text>
    <text x="36" y="182" fill="#92400e" font-family="monospace" font-size="8">Maslak HQ · Active Rental · GPS Live</text>
    <circle cx="210" cy="171" r="4" fill="#10b981"/>

    <!-- Dynamic Pre-Auth Deposit Engine -->
    <rect x="24" y="202" width="202" height="42" rx="8" fill="#451a03" fill-opacity="0.4" stroke="#d97706" stroke-width="1"/>
    <text x="36" y="220" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Pre-Auth Deposit: €2,500</text>
    <text x="36" y="234" fill="#fbbf24" font-family="monospace" font-size="7.5">Auto-Hold &amp; Return · Stripe / iyzico</text>
  </g>

  <!-- Connective Pulse Beam -->
  <path d="M 390 225 C 420 225, 430 190, 460 190" stroke="url(#goldGlow)" stroke-width="2.5" fill="none" filter="url(#glowM)"/>

  <!-- Right: Agency B2B Multi-Tenant Portal -->
  <g transform="translate(460, 95)">
    <rect width="210" height="260" rx="16" fill="url(#cardGradM)" stroke="#b45309" stroke-width="1.2" stroke-opacity="0.4"/>
    <text x="22" y="32" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">AGENCY RBAC PORTAL</text>
    <text x="22" y="47" fill="#d97706" font-family="monospace" font-size="8.5">Multi-Tenant Fleet SaaS</text>

    <!-- Rental Calendar Heatmap -->
    <g transform="translate(22, 65)">
      <rect width="166" height="60" rx="8" fill="#180b03" stroke="#78350f" stroke-width="1"/>
      <text x="12" y="18" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">Booking Schedule Grid</text>
      <!-- Calendar day blocks -->
      <rect x="12" y="26" width="18" height="12" rx="2" fill="#d97706"/>
      <rect x="34" y="26" width="18" height="12" rx="2" fill="#d97706"/>
      <rect x="56" y="26" width="18" height="12" rx="2" fill="#78350f"/>
      <rect x="78" y="26" width="18" height="12" rx="2" fill="#d97706"/>
      <rect x="100" y="26" width="18" height="12" rx="2" fill="#d97706"/>
      <rect x="122" y="26" width="18" height="12" rx="2" fill="#78350f"/>
      <rect x="144" y="26" width="12" height="12" rx="2" fill="#d97706"/>

      <rect x="12" y="42" width="18" height="12" rx="2" fill="#78350f"/>
      <rect x="34" y="42" width="18" height="12" rx="2" fill="#d97706"/>
      <rect x="56" y="42" width="18" height="12" rx="2" fill="#d97706"/>
      <rect x="78" y="42" width="18" height="12" rx="2" fill="#d97706"/>
      <rect x="100" y="42" width="18" height="12" rx="2" fill="#78350f"/>
      <rect x="122" y="42" width="18" height="12" rx="2" fill="#d97706"/>
      <rect x="144" y="42" width="12" height="12" rx="2" fill="#d97706"/>
    </g>

    <!-- Operational Metrics -->
    <rect x="22" y="140" width="166" height="58" rx="8" fill="#180b03" stroke="#78350f" stroke-width="1"/>
    <text x="14" y="20" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">Fleet Utilization: 94.2%</text>
    <text x="14" y="34" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">42 Luxury Vehicles</text>
    <text x="14" y="48" fill="#92400e" font-family="monospace" font-size="7.5">Zero Double-Booking Conflict</text>

    <!-- System Uptime -->
    <rect x="22" y="210" width="166" height="30" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
    <circle cx="34" cy="225" r="4" fill="#10b981"/>
    <text x="44" y="228" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">99.98% High Availability</text>
  </g>
</svg>