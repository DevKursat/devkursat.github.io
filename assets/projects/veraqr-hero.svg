<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="veraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120d24"/>
      <stop offset="50%" stop-color="#181135"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cardGradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a45" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#130c2a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glowV" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#veraBg)"/>

  <!-- Radial Glow -->
  <circle cx="400" cy="225" r="180" fill="#7c3aed" opacity="0.14" filter="url(#glowV)"/>

  <!-- Left: Dynamic HMAC-Signed QR Code -->
  <g transform="translate(150, 95)">
    <!-- Shield / Scanner Base -->
    <rect width="210" height="260" rx="16" fill="url(#cardGradV)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.4"/>
    <text x="24" y="32" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">VERA DYNAMIC QR</text>
    <text x="24" y="47" fill="#a855f7" font-family="monospace" font-size="8.5">HMAC-SHA256 · sub-100ms</text>

    <!-- Stylized QR Matrix Pattern -->
    <rect x="35" y="65" width="140" height="140" rx="10" fill="#0c071d" stroke="#6b21a8" stroke-width="1"/>
    
    <!-- QR Corners -->
    <rect x="45" y="75" width="34" height="34" rx="4" fill="none" stroke="#c084fc" stroke-width="4"/>
    <rect x="52" y="82" width="20" height="20" rx="2" fill="#c084fc"/>

    <rect x="131" y="75" width="34" height="34" rx="4" fill="none" stroke="#c084fc" stroke-width="4"/>
    <rect x="138" y="82" width="20" height="20" rx="2" fill="#c084fc"/>

    <rect x="45" y="161" width="34" height="34" rx="4" fill="none" stroke="#c084fc" stroke-width="4"/>
    <rect x="52" y="168" width="20" height="20" rx="2" fill="#c084fc"/>

    <!-- QR Data Elements (Glow Dots) -->
    <rect x="90" y="80" width="10" height="10" fill="#a855f7"/>
    <rect x="108" y="80" width="10" height="10" fill="#a855f7"/>
    <rect x="90" y="100" width="30" height="10" fill="#a855f7"/>
    <rect x="130" y="125" width="14" height="14" fill="#c084fc"/>
    <rect x="90" y="145" width="20" height="14" fill="#a855f7"/>
    <rect x="90" y="170" width="12" height="12" fill="#a855f7"/>
    <rect x="110" y="170" width="20" height="12" fill="#c084fc"/>

    <!-- Verification Beam -->
    <line x1="35" y1="135" x2="175" y2="135" stroke="#38bdf8" stroke-width="2" opacity="0.8" filter="url(#glowV)"/>

    <!-- Verification Badge -->
    <rect x="35" y="218" width="140" height="24" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <circle cx="48" cy="230" r="4" fill="#10b981"/>
    <text x="58" y="234" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Verified · Access Granted</text>
  </g>

  <!-- Connective Pulse Beam -->
  <path d="M 375 225 C 410 225, 430 190, 470 190" stroke="url(#purpleGlow)" stroke-width="2.5" fill="none" filter="url(#glowV)"/>

  <!-- Right: Autonomous AI Hospitality Conversation & Checkout -->
  <g transform="translate(470, 95)">
    <rect width="200" height="260" rx="16" fill="url(#cardGradV)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4"/>
    <text x="22" y="32" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">AI HOSPITALITY AGENT</text>
    <text x="22" y="47" fill="#818cf8" font-family="monospace" font-size="8.5">Natural Language · Multilingual</text>

    <!-- Chat Bubble Guest -->
    <rect x="22" y="70" width="140" height="32" rx="10" fill="#312e81"/>
    <text x="32" y="86" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="8.5">"2 Turkish coffee &amp; water"</text>
    <text x="32" y="96" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="7.5">Table #14 · 14:02</text>

    <!-- Chat Bubble AI Agent -->
    <rect x="38" y="112" width="140" height="42" rx="10" fill="#4338ca" stroke="#818cf8" stroke-width="0.8"/>
    <text x="48" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">"Siparişiniz alındı."</text>
    <text x="48" y="142" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="7.5">iyzico / Stripe checkout sent</text>

    <!-- Unified Payment Gateway Pill -->
    <g transform="translate(22, 168)">
      <rect width="156" height="36" rx="8" fill="#0f0926" stroke="#4f46e5" stroke-width="1"/>
      <text x="14" y="18" fill="#e0e7ff" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">Unified Payment</text>
      <text x="14" y="29" fill="#a5b4fc" font-family="monospace" font-size="7.5">Stripe · iyzico · USD/EUR/TRY</text>
      <circle cx="140" cy="18" r="5" fill="#10b981"/>
    </g>

    <rect x="22" y="218" width="156" height="24" rx="6" fill="#1e153d"/>
    <text x="32" y="233" fill="#94a3b8" font-family="monospace" font-size="8">PostgreSQL RLS Isolated</text>
  </g>
</svg>