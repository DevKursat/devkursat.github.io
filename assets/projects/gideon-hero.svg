<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gideonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#gideonBg)"/>

  <!-- Matrix Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Central Ambient Light -->
  <circle cx="400" cy="225" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>

  <!-- Left: Legal Document & Vector RAG Nodes -->
  <g transform="translate(140, 100)">
    <!-- Document Card -->
    <rect width="180" height="250" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <!-- Card Header -->
    <rect x="20" y="24" width="70" height="10" rx="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="155" cy="29" r="4" fill="#10b981"/>
    <!-- Document Content Lines -->
    <rect x="20" y="55" width="140" height="6" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="20" y="73" width="125" height="6" rx="3" fill="#64748b" opacity="0.4"/>
    <rect x="20" y="91" width="135" height="6" rx="3" fill="#64748b" opacity="0.4"/>
    <rect x="20" y="109" width="90" height="6" rx="3" fill="#64748b" opacity="0.3"/>
    
    <!-- Generative UI Card Highlight (Runtime Injected) -->
    <rect x="16" y="135" width="148" height="92" rx="8" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="156" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">GENERATIVE UI CARD</text>
    <rect x="26" y="168" width="128" height="18" rx="4" fill="#0284c7" fill-opacity="0.4"/>
    <text x="34" y="181" fill="#e0f2fe" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">Risk Score: 12% · TTK 2026 Pass</text>
    <rect x="26" y="196" width="60" height="18" rx="4" fill="#10b981" fill-opacity="0.8"/>
    <text x="36" y="208" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8" font-weight="700">Approve</text>
    <rect x="92" y="196" width="62" height="18" rx="4" fill="#334155"/>
    <text x="105" y="208" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">Redline</text>
  </g>

  <!-- Neural Connection Beam -->
  <path d="M 330 225 C 390 225, 410 180, 470 180" stroke="url(#accentGlow)" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <circle cx="400" cy="202" r="5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Right: Vector Embeddings & Multi-Tenant RLS Core -->
  <g transform="translate(470, 110)">
    <rect width="210" height="230" rx="12" fill="url(#cardGrad)" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.4"/>
    <text x="22" y="32" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">GIDEON RAG ENGINE</text>
    <text x="22" y="48" fill="#64748b" font-family="monospace" font-size="9">pgvector · hybrid search</text>
    
    <!-- Vector Graph Nodes -->
    <circle cx="50" cy="100" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="50" cy="100" r="4" fill="#38bdf8"/>
    <text x="72" y="104" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Maslak Law Corpus</text>

    <line x1="50" y1="114" x2="90" y2="155" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
    
    <circle cx="90" cy="160" r="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <circle cx="90" cy="160" r="5" fill="#10b981"/>
    <text x="114" y="164" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">PostgreSQL RLS</text>

    <line x1="64" y1="100" x2="140" y2="105" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>

    <circle cx="150" cy="105" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <circle cx="150" cy="105" r="4" fill="#818cf8"/>
    <text x="120" y="85" fill="#94a3b8" font-family="monospace" font-size="8">dim=1536</text>

    <!-- Status Badge -->
    <rect x="22" y="192" width="166" height="22" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="34" cy="203" r="3.5" fill="#10b981"/>
    <text x="44" y="206" fill="#94a3b8" font-family="monospace" font-size="8.5">OWASP LLM SECURED · 0 BREACH</text>
  </g>
</svg>