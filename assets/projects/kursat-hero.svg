<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="kursatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0707"/>
      <stop offset="50%" stop-color="#2a0c0c"/>
      <stop offset="100%" stop-color="#0a0202"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cardGradK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1212" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#210808" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glowK" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#kursatBg)"/>

  <!-- Radial Glow -->
  <circle cx="400" cy="225" r="180" fill="#dc2626" opacity="0.13" filter="url(#glowK)"/>

  <!-- Left: Mobile Device Frame with Feed & Live Stream -->
  <g transform="translate(150, 85)">
    <!-- Smartphone Shell -->
    <rect width="180" height="280" rx="24" fill="#140404" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Speaker & Camera notch -->
    <rect x="65" y="10" width="50" height="5" rx="2.5" fill="#3f1010"/>

    <!-- Screen Area -->
    <rect x="12" y="24" width="156" height="236" rx="14" fill="#1e0808"/>

    <!-- Live Broadcast Banner -->
    <rect x="22" y="34" width="136" height="65" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <!-- Live Badge -->
    <rect x="30" y="42" width="40" height="16" rx="4" fill="#dc2626"/>
    <text x="38" y="53" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8" font-weight="800">LIVE</text>
    <text x="76" y="53" fill="#fca5a5" font-family="monospace" font-size="8">5,420 viewers</text>

    <!-- Broadcast Soundwaves -->
    <line x1="32" y1="78" x2="32" y2="86" stroke="#f87171" stroke-width="2"/>
    <line x1="40" y1="72" x2="40" y2="92" stroke="#f87171" stroke-width="2"/>
    <line x1="48" y1="68" x2="48" y2="96" stroke="#f87171" stroke-width="2"/>
    <line x1="56" y1="74" x2="56" y2="90" stroke="#f87171" stroke-width="2"/>
    <line x1="64" y1="78" x2="64" y2="86" stroke="#f87171" stroke-width="2"/>

    <!-- Feed Cards -->
    <rect x="22" y="108" width="136" height="42" rx="6" fill="#2d0a0a"/>
    <circle cx="36" cy="124" r="8" fill="#dc2626"/>
    <rect x="50" y="118" width="60" height="6" rx="2" fill="#fca5a5"/>
    <rect x="50" y="128" width="95" height="5" rx="2" fill="#7f1d1d"/>

    <rect x="22" y="156" width="136" height="42" rx="6" fill="#2d0a0a"/>
    <circle cx="36" cy="172" r="8" fill="#b91c1c"/>
    <rect x="50" y="166" width="70" height="6" rx="2" fill="#fca5a5"/>
    <rect x="50" y="176" width="85" height="5" rx="2" fill="#7f1d1d"/>

    <!-- Bottom Nav -->
    <rect x="22" y="215" width="136" height="24" rx="6" fill="#140404"/>
    <circle cx="45" cy="227" r="4" fill="#ef4444"/>
    <circle cx="90" cy="227" r="4" fill="#7f1d1d"/>
    <circle cx="135" cy="227" r="4" fill="#7f1d1d"/>
  </g>

  <!-- Connective Pulse Beam -->
  <path d="M 340 225 C 380 225, 410 190, 450 190" stroke="url(#redGlow)" stroke-width="2.5" fill="none" filter="url(#glowK)"/>

  <!-- Right: High-Throughput Node Mesh & Anti-Bot Engine -->
  <g transform="translate(450, 95)">
    <rect width="220" height="260" rx="16" fill="url(#cardGradK)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.4"/>
    <text x="22" y="32" fill="#fee2e2" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CIVIC SCALE TELEMETRY</text>
    <text x="22" y="47" fill="#ef4444" font-family="monospace" font-size="8.5">React Native · WebSocket Mesh</text>

    <!-- Metrics Grid -->
    <g transform="translate(22, 65)">
      <rect width="84" height="48" rx="6" fill="#2b0a0a" stroke="#7f1d1d" stroke-width="1"/>
      <text x="12" y="22" fill="#fca5a5" font-family="monospace" font-size="12" font-weight="800">5,000+</text>
      <text x="12" y="36" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="7.5">Month-1 MAU</text>

      <rect x="92" y="0" width="84" height="48" rx="6" fill="#2b0a0a" stroke="#7f1d1d" stroke-width="1"/>
      <text x="104" y="22" fill="#fca5a5" font-family="monospace" font-size="12" font-weight="800">&lt;50ms</text>
      <text x="104" y="36" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="7.5">Socket Ping</text>
    </g>

    <!-- Anti-Bot Defense Engine -->
    <rect x="22" y="125" width="176" height="52" rx="8" fill="#1f0707" stroke="#b91c1c" stroke-width="1"/>
    <text x="14" y="20" fill="#fee2e2" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">Anti-Bot &amp; Spam Shield</text>
    <text x="14" y="34" fill="#fca5a5" font-family="monospace" font-size="8">99.4% Sybil Attack Suppression</text>
    <text x="14" y="44" fill="#7f1d1d" font-family="monospace" font-size="7">Zero Campaign Downtime</text>

    <!-- Grassroots Partner Badge -->
    <rect x="22" y="190" width="176" height="48" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <circle cx="36" cy="214" r="5" fill="#10b981"/>
    <text x="48" y="210" fill="#fee2e2" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">National Leadership Scale</text>
    <text x="48" y="224" fill="#fca5a5" font-family="monospace" font-size="7.5">High-Throughput Campaign Infrastructure</text>
  </g>
</svg>