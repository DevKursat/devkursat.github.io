<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25F4EE"/>
      <stop offset="100%" stop-color="#FE2C55"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="phoneClip">
      <rect x="235" y="30" width="250" height="400" rx="20"/>
    </clipPath>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 115 H720 M0 230 H720 M0 345 H720 M180 0 V460 M360 0 V460 M540 0 V460" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Glow orb -->
  <circle cx="360" cy="230" r="140" fill="#25F4EE" opacity="0.12" filter="url(#glow)"/>
  <circle cx="380" cy="210" r="120" fill="#FE2C55" opacity="0.10" filter="url(#glow)"/>

  <!-- Phone Mockup Container -->
  <g>
    <!-- Shadow -->
    <rect x="230" y="25" width="260" height="410" rx="24" fill="rgba(0,0,0,0.7)" filter="url(#glow)"/>
    <rect x="233" y="28" width="254" height="404" rx="22" fill="#121218" stroke="url(#neon)" stroke-width="1.5"/>

    <!-- Embedded scene -->
    <g clip-path="url(#phoneClip)">
      <image href="/links/banner.jpg" x="180" y="30" width="400" height="400" preserveAspectRatio="xMidYMid slice" opacity="0.85"/>
      <rect x="235" y="30" width="250" height="400" fill="url(#bg)" opacity="0.3"/>
      
      <!-- Gradient overlay bottom -->
      <rect x="235" y="240" width="250" height="190" fill="black" opacity="0.75"/>
      
      <!-- TikTok UI overlay -->
      <!-- Right sidebar buttons -->
      <g transform="translate(445, 180)">
        <!-- Avatar -->
        <circle cx="16" cy="16" r="14" fill="#25F4EE" stroke="#fff" stroke-width="1.5"/>
        <text x="16" y="20" fill="#000" font-family="-apple-system, sans-serif" font-weight="900" font-size="11" text-anchor="middle">K</text>
        
        <!-- Heart -->
        <path d="M16 54 C10 46 4 52 4 58 C4 67 16 75 16 75 C16 75 28 67 28 58 C28 52 22 46 16 54 Z" fill="#FE2C55"/>
        <text x="16" y="87" fill="#fff" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle" font-weight="600">1.2M</text>

        <!-- Comments -->
        <circle cx="16" cy="110" r="10" fill="rgba(255,255,255,0.2)"/>
        <text x="16" y="113" fill="#fff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">💬</text>
        <text x="16" y="132" fill="#fff" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle" font-weight="600">84.2K</text>
        
        <!-- Share -->
        <circle cx="16" cy="155" r="10" fill="rgba(255,255,255,0.2)"/>
        <text x="16" y="158" fill="#fff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">↗</text>
        <text x="16" y="177" fill="#fff" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle" font-weight="600">42K</text>
      </g>

      <!-- Bottom Caption -->
      <text x="250" y="340" fill="#fff" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">@kursat.yz</text>
      <text x="250" y="360" fill="#f4f4f6" font-family="-apple-system, sans-serif" font-size="10.5">Hamam böceğiyle Boğaz'da çay simit 🫖</text>
      <text x="250" y="376" fill="#888" font-family="-apple-system, sans-serif" font-size="9.5">#animasyon #mizah #blender3d</text>
      
      <!-- Audio bar -->
      <g transform="translate(250, 395)">
        <text x="0" y="10" fill="#fff" font-size="9">🎵 Orijinal Ses — Kürşat Yılmaz</text>
      </g>
    </g>
  </g>

  <!-- Left / Right Callout Labels -->
  <text x="70" y="210" fill="#25F4EE" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="-0.02em">TikTok</text>
  <text x="70" y="240" fill="#8b8b99" font-family="'JetBrains Mono', monospace" font-size="13">@kursat.yz // 1.2M+ İZLENME</text>
  <text x="70" y="265" fill="#f4f4f6" font-family="-apple-system, sans-serif" font-size="13">Viral 2D/3D Animasyon Skeçleri</text>

  <rect x="520" y="195" width="140" height="34" rx="17" fill="rgba(37,244,238,0.1)" stroke="#25F4EE" stroke-width="1"/>
  <text x="590" y="217" fill="#25F4EE" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" text-anchor="middle">CANLI KANAL ↗</text>
</svg>