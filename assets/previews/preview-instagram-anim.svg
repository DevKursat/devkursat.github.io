<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a12"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F58529"/>
      <stop offset="50%" stop-color="#DD2A7B"/>
      <stop offset="100%" stop-color="#8134AF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="360" cy="230" r="160" fill="#DD2A7B" opacity="0.08" filter="url(#glow)"/>

  <!-- Center Card: Instagram Reel Post Mockup -->
  <g transform="translate(160, 40)">
    <rect width="400" height="380" rx="18" fill="#14141c" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <!-- Header -->
    <circle cx="35" cy="35" r="16" fill="url(#instaGrad)"/>
    <circle cx="35" cy="35" r="14" fill="#050508"/>
    <text x="35" y="40" fill="#fff" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">K</text>
    
    <text x="65" y="34" fill="#fff" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">kursatsi</text>
    <circle cx="120" cy="30" r="5" fill="#38bdf8"/>
    <text x="120" y="33" fill="#000" font-size="7" font-weight="bold" text-anchor="middle">✓</text>
    
    <text x="65" y="48" fill="#888" font-family="-apple-system, sans-serif" font-size="11">Animasyon &amp; Mizah Stüdyosu</text>
    <text x="360" y="38" fill="#888" font-size="18">•••</text>

    <!-- Visual Image (The Animation Scene) -->
    <g clip-path="url(#imgClip)">
      <clipPath id="imgClip">
        <rect x="15" y="65" width="370" height="230" rx="10"/>
      </clipPath>
      <image href="/links/banner.jpg" x="15" y="65" width="370" height="230" preserveAspectRatio="xMidYMid slice"/>
      <rect x="30" y="80" width="85" height="26" rx="6" fill="rgba(0,0,0,0.7)"/>
      <text x="72" y="97" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">REELS 🎬</text>
    </g>

    <!-- Post Stats & Actions -->
    <g transform="translate(20, 315)">
      <text x="0" y="16" fill="#f43f5e" font-size="18">❤️</text>
      <text x="30" y="16" fill="#fff" font-size="18">💬</text>
      <text x="60" y="16" fill="#fff" font-size="18">✈️</text>
      <text x="330" y="16" fill="#fff" font-size="18">🔖</text>
      
      <text x="0" y="42" fill="#fff" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">48.291 beğenme</text>
    </g>
  </g>
</svg>