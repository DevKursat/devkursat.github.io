        <text x="42" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">#webdev</text>

        <rect x="95" y="0" width="60" height="26" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
        <text x="125" y="17" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">#ai</text>

        <rect x="165" y="0" width="110" height="26" rx="6" fill="rgba(244,63,94,0.1)" stroke="rgba(244,63,94,0.3)"/>
        <text x="220" y="17" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">#architecture</text>
      </g>
    </g>

    <!-- Bottom Reactions -->
    <g transform="translate(30, 315)" fill="#d4d4d8" font-family="-apple-system, sans-serif" font-size="13">
      <text x="0" y="16">💖 342 reactions</text>
      <text x="140" y="16">💬 58 comments</text>
