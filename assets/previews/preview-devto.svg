      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#040506"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <g transform="translate(100, 45)">
    <rect width="520" height="370" rx="16" fill="#13161c" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <!-- Top Bar with DEV Badge -->
    <g transform="translate(30, 30)">
      <rect width="48" height="30" rx="5" fill="#000" stroke="#fff" stroke-width="1.5"/>
      <text x="24" y="21" fill="#fff" font-family="-apple-system, sans-serif" font-weight="900" font-size="13" text-anchor="middle">DEV</text>
      
      <text x="65" y="16" fill="#fff" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Kürşat Yılmaz</text>
      <text x="65" y="32" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="11">dev.to/devkursat • Global Engineering</text>
    </g>

    <!-- Article Title -->
    <g transform="translate(30, 95)">
      <text x="0" y="30" fill="#f4f4f6" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="-0.02em">
