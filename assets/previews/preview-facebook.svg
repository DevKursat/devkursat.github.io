<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <g transform="translate(110, 45)">
    <rect width="500" height="370" rx="16" fill="#141622" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <!-- Header -->
    <circle cx="40" cy="40" r="20" fill="#1877F2"/>
    <text x="40" y="47" fill="#fff" font-family="-apple-system, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">f</text>
    <text x="75" y="36" fill="#fff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">Kürşat Yılmaz Video Topluluğu</text>
    <text x="75" y="52" fill="#888" font-family="-apple-system, sans-serif" font-size="12">@kursatsi • 45.000 Takipçi</text>
    
    <!-- Video Player Preview -->
    <g clip-path="url(#fbClip)">
      <clipPath id="fbClip">
        <rect x="20" y="75" width="460" height="230" rx="10"/>
      </clipPath>
      <image href="/links/banner.jpg" x="20" y="75" width="460" height="230" preserveAspectRatio="xMidYMid slice"/>
      <rect x="220" y="165" width="60" height="44" rx="10" fill="rgba(0,0,0,0.75)"/>
      <polygon points="245,178 263,187 245,196" fill="#fff"/>
    </g>

    <!-- Bottom Actions -->
    <g transform="translate(30, 335)" fill="#aaa" font-family="-apple-system, sans-serif" font-size="13">
      <text x="0" y="10">👍 18.2K Beğeni</text>
      <text x="150" y="10">💬 2.1K Yorum</text>
      <text x="300" y="10">↗ 4.8K Paylaşım</text>
    </g>
  </g>
</svg>