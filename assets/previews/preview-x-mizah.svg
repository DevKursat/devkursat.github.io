<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Center X Tweet Card -->
  <g transform="translate(100, 50)">
    <rect width="520" height="360" rx="16" fill="#111116" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <!-- User Row -->
    <g transform="translate(30, 30)">
      <circle cx="24" cy="24" r="24" fill="#222" stroke="#fff" stroke-width="1"/>
      <text x="24" y="32" fill="#fff" font-family="-apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle">K</text>
      
      <text x="60" y="22" fill="#fff" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">Kürşat Yılmaz</text>
      <!-- X Logo -->
      <path d="M175 10 L185 24 M185 10 L175 24" stroke="#fff" stroke-width="2"/>
      
      <text x="60" y="42" fill="#71767b" font-family="-apple-system, sans-serif" font-size="14">@kursatsi</text>
    </g>

    <!-- Tweet Content -->
    <g transform="translate(30, 105)">
      <text x="0" y="24" fill="#e7e9ea" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" line-height="1.5">
        Sabah uyandım, hamam böceği bana "çayı demle
      </text>
      <text x="0" y="52" fill="#e7e9ea" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">
        Boğaz'a iniyoruz" diyor.
      </text>
      <text x="0" y="88" fill="#e7e9ea" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">
        Haklısın kral dedim montu giydim. 🫖🦗🌊
      </text>
    </g>

    <!-- Media Card inside Tweet -->
    <g transform="translate(30, 220)">
      <rect width="460" height="60" rx="10" fill="#16181c" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="26" fill="#1d9bf0" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">yeni bölüm yayında // devkursat.github.io/links</text>
      <text x="20" y="46" fill="#71767b" font-family="-apple-system, sans-serif" font-size="12">Animasyon skeçleri ve mizah güncesi</text>
    </g>

    <!-- Metrics Bar -->
    <g transform="translate(30, 310)" fill="#71767b" font-family="-apple-system, sans-serif" font-size="13">
      <text x="0" y="16">💬 1.4K</text>
      <text x="110" y="16">🔁 8.9K</text>
      <text x="220" y="16">❤️ 42.5K</text>
      <text x="330" y="16">📊 850K Görüntülenme</text>
    </g>
  </g>
</svg>